name: SecureTrack Continuous Integration

on:
  push:
    branches:
      - main
      - fix/securetrack-global-two-device-release
  pull_request:
    branches: [ main ]

jobs:
  web-tests:
    name: Web Dashboard Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-dashboard/package-lock.json

      - name: Install Web Dashboard Dependencies
        run: |
          cd web-dashboard
          npm ci

      - name: Install Functions Test Dependencies
        run: |
          cd functions
          npm ci

      - name: Run Web Authentication Tests
        run: |
          node --test web-dashboard/test/auth.test.js

      - name: Run Web Dashboard Linter
        run: |
          cd web-dashboard
          npm run lint

      - name: Run Security Suite Unit Tests
        run: |
          node --test functions/test/pairing.test.js

      - name: Build Web Dashboard
        run: |
          cd web-dashboard
          npm run build

  android-tests:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate CI google-services.json
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "securetrack-ci-fake",
              "storage_bucket": "securetrack-ci-fake.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.example.securetrack"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyFakeKeyForCICompilationOnlyNonSecret12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Run Android Unit Tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble Android Debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon
